name: Android Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the verified bundle to Google Play production
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set temporary signing and verification paths
        run: |
          echo "ANDROID_SIGNING_DIR=$RUNNER_TEMP/android-signing" >> "$GITHUB_ENV"
          echo "ANDROID_CREDENTIALS=$RUNNER_TEMP/android-signing/credentials.json" >> "$GITHUB_ENV"
          echo "GOOGLE_PLAY_JSON_KEY=$RUNNER_TEMP/android-signing/google-play.json" >> "$GITHUB_ENV"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool-1.18.3.jar" >> "$GITHUB_ENV"
      - name: Install Android build tools and bundletool
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"
          "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum --check --status
      - name: Install dependencies and verify app
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Restore signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_CREDENTIALS_JSON: ${{ secrets.ANDROID_CREDENTIALS_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PUBLISH_TO_PLAY: ${{ inputs.publish }}
        run: python3 fastlane/restore_android_signing.py
      - name: Build and verify AAB
        run: bundle exec fastlane android build
      - name: Save verified AAB and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ github.sha }}
          path: |
            build-artifacts/*.aab
            build-artifacts/*.verified.json
          if-no-files-found: error
          retention-days: 7
      - name: Submit to Google Play production
        if: inputs.publish
        run: |
          AAB=$(find build-artifacts -maxdepth 1 -name '*.aab' -print -quit)
          bundle exec fastlane android publish "aab:$PWD/$AAB"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
